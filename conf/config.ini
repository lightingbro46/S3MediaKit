#!!!!This configuration file is an example configuration file, which is intended to tell readers the specific meaning and function of each configuration item，
#!!!!When executing cmake, this configuration file will be copied to the release/${OS type}/${compile type} (for example, release/linux/Debug) folder.
#!!!!This folder (release/${OS type}/${compile type}) is also the target path generated by the executable program. When executing the MediaServer process, it will load the config.ini file in the same directory as the configuration file by default.
#!!!!If you modify this sample configuration file (conf/config.ini), it will not be loaded by the MediaServer process, because the MediaServer process loads the default release/${OS type}/${compile type}/config.ini。
#!!!!Of course, every time you execute cmake, the file will be copied to release/${OS type}/${compile type}/config.ini,
#!!!!However, it is generally recommended that you directly modify the release/${OS type}/${compile type}/config.ini file. Modifying this file generally does not work unless you use the -c parameter to specify it to this file when you run MediaServer.

[api]
#Whether to debug the http API? After enabling debugging, the content and reply of each http request will be printed
apiDebug=1
#Some more sensitive http APIs need to provide secret when accessing, otherwise they do not have permission to call.
#If accessed through 127.0.0.1, then secret can be not provided
secret=035c73f7-bb6b-4889-a715-d9eb2d1925cc
#Screenshot save the path root directory, screenshots are generated and obtained through http api (/index/api/getSnap).
snapRoot=./www/snap/
#The default screenshot image can be returned to the default preset image after starting FFmpeg screenshot but the screenshot has not been generated yet.
defaultSnap=./www/logo.png
#downloadFile The http interface can access the root directory of the file, supports multiple directories, and different directories are separated by semicolons (;).
downloadRoot=./www

[ffmpeg]
#FFmpeg executable program path, supports relative path/absolute path
bin=/usr/bin/ffmpeg
#FFmpeg command template for pulling streams and pushing streams. Through this template, some recoded parameters can be set.
cmd=%s -re -i %s -c:a aac -strict -2 -ar 44100 -ab 48k -c:v libx264 -f flv %s
#The command to generate screenshots by FFmpeg, you can change the resolution or quality of the screenshots by modifying the configuration.
snap=%s -i %s -y -f mjpeg -frames:v 1 -an %s
#The path of the FFmpeg log is not generated if empty
#Can be relative (relative to this executable program directory) or absolute path
log=./ffmpeg/ffmpeg.log
#The time for automatic restart (seconds), default is 0, that is, it does not restart automatically. It is mainly to avoid the abnormal synchronization caused by long-term ffmpeg flow pulling.
restart_sec=0

#Related switches for protocol conversion; if the addStreamProxy api and on_publish hook reply does not specify the protocol conversion parameters, these configuration items are used
[protocol]
#Whether to enable frame-level timestamp overwrite when transferring the protocol
# 0:Adopt absolute timestamps for source video streams without any changes
# 1:System time stamp when using s3mediakit to receive data(Have smoothing)
# 2:Use source video stream timestamp relative timestamp(Growth), there are timestamp jumps and fallback corrections
modify_stamp=2
#Whether to enable audio by transferring the protocol
enable_audio=1
#Add acc mute audio, this switch is invalid when the audio is turned off
add_mute_audio=1
#Whether to turn off directly when no one watches it(Instead of returning close via on_none_reader hook)
#When this configuration is set to 1, if no one watches this stream, on_none_reader will not be triggered hook callback,
#Instead, the stream will be closed directly
auto_close=0

#After the push stream is disconnected, the push stream can be reconnected within the timeout time, so that the player will continue to play.
#Set 0 to turn off this feature(Pushing the stream disconnection will cause the player to be disconnected immediately)
#This parameter should not be greater than the player timeout time;Unit milliseconds
continue_push_ms=15000

#Smooth send timer interval, unit milliseconds, set 0 to turn off; affects CPU performance and increases memory when turned on
#After this configuration is turned on, it can solve the problem that some stream transmission is not smooth, resulting in s3mediakit forwarding is not smooth.
paced_sender_ms=0

#Whether to turn on convert to hls(mpegts)
enable_hls=0
#Whether to turn on convert to hls(fmp4)
enable_hls_fmp4=1
#Whether to enable MP4 recording
enable_mp4=0
#Whether to turn on the conversion to rtsp/webrtc
enable_rtsp=1
#Whether to turn on the conversion to rtmp/flv
enable_rtmp=0
#Whether to turn on convert to http-ts/ws-ts
enable_ts=0
#Whether to turn on convert to http-fmp4/ws-fmp4
enable_fmp4=0

#Whether to use mp4 recording as a viewer
mp4_as_player=0
#mp4 slice size, unit seconds
mp4_max_second=3600
#mp4 recording and saving path
mp4_save_path=./www

#hls record saving path
hls_save_path=./www

###### The following are switches for on-demand transfer protocol. When testing the receiving and pushing performance of S3MediaKit, please set the following switches to 1.
###### If you can't use a certain protocol, you can set the following switch to save resources(But it can still be played, but the first player experience is slightly worse)，
###### If you want to get the best user experience in some kind of protocol, please set 0(The first player can open in seconds without losing the screen)
#Is the hls protocol generated on demand? If hls.segNum configuration is 0(Meaning hls recording), then hls will be generated(Regardless of this switch)
hls_demand=1
#Is the rtsp[s] protocol generated on demand?
rtsp_demand=0
#Is the rtmp[s], http[s]-flv, ws[s]-flv protocol generated on demand?
rtmp_demand=0
#Is the http[s]-ts protocol generated on demand?
ts_demand=0
#Is the http[s]-fmp4 and ws[s]-fmp4 protocol generated on demand?
fmp4_demand=0

[general]
#Whether to enable virtual hosting
enableVhost=0
#The player or stream pusher will trigger the hook.on_flow_report event (how much traffic event is used),
#flowThreshold parameter controls the trigger hook.on_flow_report event threshold, which is triggered only after the usage traffic exceeds this threshold. Unit KB
flowThreshold=1024
#Play maximum waiting time, in milliseconds
#When playing a stream, if the stream does not exist,
#S3MediaKit will make the player wait for maxStreamWaitMS milliseconds at most
#If the stream is registered successfully within this time, it will be immediately returned to the player to play successfully
#Otherwise, the return player does not find the stream. The purpose of this mechanism is to play first and then push the stream.
maxStreamWaitMS=15000
#When a stream is unwatched, the maximum waiting time for triggering the hook.on_stream_none_reader event, in milliseconds
#When cooperating with the hook.on_stream_none_reader event, it is possible to automatically stop pulling or stop receiving pushing streams without anyone watching.
streamNoneReaderDelayMS=20000
#When pulling the stream agent, if the stream is interrupted and reconnected successfully, will the previous media stream data be deleted? If the deletion is started again,
#If you do not delete, you will continue to write the previous data (when recording hls/mp4, you will continue to write after the previous file)
resetWhenRePlay=1
#Merge write cache size (in milliseconds). Merge write means that the server caches certain data before writing to the socket at one time. This can improve performance, but will increase delay.
#After turning on, TCP_NODELAY will be turned off and MSG_MORE will be turned on at the same time.
mergeWriteMS=0
#The server's unique id is used to trigger the hook. Which server is the difference between the server?
mediaServerId=your_server_id

#Waiting for the uninitialized track for up to milliseconds, the uninitialized track will be ignored after the timeout.
wait_track_ready_ms=10000
#Wait for the audio track to receive data for up to milliseconds, timeout and no audio data received at all, ignore audio track
#Speed ​​up some streaming metadata with packages means that there is audio, but there is actually no streaming time (such as GB28181 from many manufacturers PS）
wait_audio_track_data_ms=1000
#If the stream only has a single track, waits for a few milliseconds at most, and does not receive data from other tracks after the timeout, it is considered a single track
#If the protocol metadata declares a specific track number, then there is no waiting time
wait_add_track_ms=3000
#If the track is not ready, we cache the frame data first, but there is a maximum number limit to prevent memory overflow
unready_frame_cache=100
#Whether to enable the event broadcast of the number of viewers change, set 1 to enable, and set 0 to turn off
broadcast_player_count_changed=0
#Binded local network card ip
listen_ip=::

[hls]
#hls writes the buf size of the file, adjusting the parameters can improve the performance of the file io
fileBufSize=65536
#hls maximum slicing time
segDur=2
#In the m3u8 index, hls retains the number of slices (actually retains the number of slices + segRetains)
#If set to 0, the slice is not deleted and the m3u8 file records the slice list in full
segNum=3
#The number of HLS slice delays, if greater than 0, the hls_delay.m3u8 file will be generated, and if 0 is not generated
segDelay=0
#After the HLS slice is removed from the m3u8 file, the number of pieces that continue to be retained on disk
segRetain=5
#Whether to broadcast hls slice (ts/fmp4) completion notification (on_record_ts)
broadcastRecordTs=0
#Live hls file deletion delay, unit seconds, issue: #913
deleteDelaySec=10
#After this option is enabled, the m3u8 file will still be live, but the slice files will be retained as on-demand.
#When segDur is set to 0 or segKeep is set to 1, a vod.m3u8 file will be generated in each slice folder for on-demand recordings of this time period.
segKeep=0
#If set to 1, the first slice length is forced to be set to 1 GOP. When the GOP is less than segDur, the first screen speed can be increased
fastRegister=0

[hook]
#Whether to enable hook event, after enabled, the push and pull stream will be authenticated.
enable=0
#Player or streamer uses traffic events, and is closed if empty
on_flow_report=
#Access the http file authentication event, close the authentication event if empty
on_http_access=
#Play authentication event, close authentication if empty
on_play=
#The authentication event is pushed and the authentication is closed if the authentication is empty.
on_publish=
#Record mp4 slice completion event
on_record_mp4=
# Record hls ts (or fmp4) slice completion event
on_record_ts=
#rtsp play authentication event, in which the user name and password of rtsp are compared
on_rtsp_auth=
#Whether the exclusive authentication event is enabled for rtsp playback, and if it is empty, the rtsp authentication is turned off. rtsp playback authentication also supports url authentication
#It is recommended that developers use url parameters to authenticate. RTSP username and password authentication is generally used more frequently on the device.
#After enabling rtsp exclusive authentication, the on_play authentication event will no longer be triggered.
on_rtsp_realm=
#Remote telnet debug authentication event
on_shell_login=
#Live stream registration or cancellation event
on_stream_changed=
#Filter the protocol type of on_stream_changed hook, you can choose to listen only to certain interested protocols; if empty, the protocol will not be filtered
stream_changed_schemas=rtsp/rtmp/fmp4/ts/hls/hls.fmp4
#The unwatched stream event, through which you can choose whether to turn off the unwatched stream. Use with general.streamNoneReaderDelayMS option
on_stream_none_reader=
#During playback, no stream event was found. By cooperating with the hook.on_stream_none_reader event, you can complete the streaming on demand.
on_stream_not_found=
#Server startup report, which can be used for server crash restart event monitoring
on_server_started=
#Server exit report, triggered when the server exits normally
on_server_exited=
#Server Insurance Report
on_server_keepalive=
#Callback when sending rtp(startSendRtp) passively closes
on_send_rtp_stopped=
#rtp server timeout no data received
on_rtp_server_timeout=
#Server load device and service configuration
on_server_load=http://anat.vtscloud.vn/api/camera/channels?recording_id=3c:ec:ef:90:b3:7a
#Server report device and service statistics
on_server_report=

#The maximum waiting time for hook API, in seconds
timeoutSec=10
#Keepalive hook trigger interval, unit seconds, float type
alive_interval=10.0
#Report hook trigger interval, unit seconds, float type
report_interval=60.0
#Hook notification failed retry count, positive integer. Don't try again if it is 0, try again if it is 1, and so on
retry=1
#Hook notification failed to retry delay, unit seconds, float type
retry_delay=3.0

[cluster]
#Set the source site streaming url template, the format is similar to printf, the first %s specifies the app, the second %s specifies the stream_id,
#After turning on cluster mode, the on_stream_not_found and on_stream_none_reader hooks will be invalid.
#Traceability mode supports the following types:
#rtmp method: rtmp://127.0.0.1:1935/%s/%s
#rtsp method: rtsp://127.0.0.1:554/%s/%s
#HLS method: http://127.0.0.1:80/%s/%s/hls.m3u8
#http-ts method: http://127.0.0.1:80/%s/%s.live.ts
#Support multiple source stations, and different source stations are separated by semicolons (;)
origin_url=
#The total timeout timeout of the traceability is in seconds, float type; if there are 3 source stations, then the single traceability timeout is timeout_sec divided by 3
#The single traceability timeout should not exceed the general.maxStreamWaitMS configuration
timeout_sec=15
#Number of failed attempts for source traceability, permanent attempts at -1
retry_count=3

[http]
#http server character encoding set
charSet=utf-8
#http link timeout time
keepAliveSecond=30
#The maximum number of bytes of the http request body. If the post body is too large, it is not suitable to cache the body in memory
maxReqSize=40960
#404 web page content, users can customize 404 web pages
#notFound=<html><head><title>404 Not Found</title></head><body bgcolor="white"><center><h1>The resources you access do not exist！</h1></center><hr><center>S3MediaKit-4.0</center></body></html>
#http server listening port
port=80
#http file server root directory
#Can be relative (relative to this executable program directory) or absolute path
rootPath=./www
#http file server reads file cache size, unit BYTE, adjusting this parameter can optimize file io performance
sendBufSize=65536
#https server listening port
sslport=443
#Whether to display the folder menu, you can browse the folder after opening it
dirMenu=1
#Virtual directory, virtual directory names and file paths are separated by "," and "," and multiple configuration paths are separated by ";"
#For example, assign the value to app_a,/path/to/a;app_b,/path/to/b, then
#The corresponding file path to access http://127.0.0.1/app_a/file_a is /path/to/a/file_a
#The corresponding file path to access http://127.0.0.1/app_b/file_b is /path/to/b/file_b
#Accessing other http paths, the corresponding file path is still in rootPath
virtualPath=
#Prohibit the use of mmap cache for files with suffixes, separate them with ","
#For example, the assignment is .mp4, .flv
#Then access files with suffixes .mp4 and .flv will not be cached
forbidCacheSuffix=
#You can put the real client IP before the http proxy in the http header: https://github.com/S3MediaKit/S3MediaKit/issues/1388
#Do not expose this key, otherwise it may cause fake client ip
forwarded_ip_header=
#All cross-domain requests are allowed by default
allow_cross_domains=1
#Allow access to the whitelist of IP address ranges of http API and http file indexes. No restrictions are required if empty
allow_ip_range=::1,127.0.0.1,172.16.0.0-172.31.255.255,192.168.0.0-192.168.255.255,10.0.0.0-10.255.255.255

[multicast]
#rtp multicast dead multicast IP address
addrMax=239.255.255.255
#rtp multicast start multicast IP address
addrMin=239.0.0.0
#Multicast udp ttl
udpTTL=64

[record]
#The application name of mp4 recording or mp4 on demand can be prevented from being arbitrary on demand by restricting the application name.
#On-demand files must be placed in this folder
appName=record
#mp4 recording and writing file cache, unit BYTE, and adjusting parameters can improve file io performance
fileBufSize=65536
#mp4 on demand each streaming data, in milliseconds,
#Reducing this value can make on-demand data sending smoother, and increasing this value can save CPU resources.
sampleMS=500
#Is it possible to write the secondary keyframe index to the header after the recording of mp4 is completed?
fastStart=0
#Whether MP4 on-demand playback of files (rtsp/rtmp/http-flv/ws-flv) is looping
fileRepeat=0
#Whether the MP4 recording and writing file format uses fmp4? If enabled, files that have not been recorded without power off can be opened normally.
enableFmp4=0

[rtmp]
#rtmp must complete the handshake within this time, otherwise the server will be disconnected in seconds
handshakeSecond=15
#rtmp timeout time, if no client data is received within that time,
#Or the tcp send cache exceeds this time, the connection will be disconnected in seconds
keepAliveSecond=15
#rtmp server listening port
port=1935
#rtmps server listening address
sslport=0
# Is rtmp direct proxy mode?
directProxy=1
#h265 rtmp packaging adopts enhanced rtmp standard or domestic expansion standard
enhanced=0

[rtp]
#Audio mtu size, this parameter limits the maximum number of RTP bytes, it is recommended not to exceed 1400
#Increasing this value will significantly increase the live broadcast delay
audioMtuSize=600
#Video mtu size, this parameter limits the maximum number of RTP bytes, it is recommended not to exceed 1400
videoMtuSize=1400
#The maximum length limit of rtp package, unit KB, is mainly used to identify TCP context corruption and obtain the wrong rtp
rtpMaxSize=10
# When rtp is packaged, the low-latency switch is turned off by default (0). h264 has multiple slices (NALs) in one frame. In this case, if it is turned on, the screen may be lost.
lowLatency=0
# Does the H264 rtp packaging mode adopt stap-a mode (to be compatible with webrtc on old browsers) or Single NAL unit packet per H.264 mode?
# Some old RTSP devices do not support stap-a RTP. Setting this configuration to 0 can improve compatibility
h264_stap_a=1

[rtp_proxy]
#Export debugging data (including rtp/ps/h264) to this directory, and close data export if empty
dumpDir=
#UDP and TCP proxy servers, support RTP (must be ts or ps type) proxy
port=10000
#rtp timeout time, unit seconds
timeoutSec=15
#Random port range, ensure a minimum of 36 ports
#This range also limits the RTSP server udp port range.
port_range=30000-35000
#rtp h264 pt of load
h264_pt=98
#rtp h265 pt of load
h265_pt=99
#rtp ps pt load
ps_pt=96
#rtp opus pt of load
opus_pt=100
#Whether to enable the gop cache optimization in advance to enable the cascading experience of startSendRtp and startRecord related functions, it is enabled by default, and 1 GOP is cached
#If the relevant interfaces after startSendRtp and startRecord are not called, the memory can be saved by setting 0; if multiple gop caches, the parameter can be increased
gop_cache=1

#When sending g711 rtp package, what is the voice duration of each package? The default is 100 ms, and the range is 20~180ms (gb28181-2016, c.2.4 stipulated).
#It is best to be a multiple of 20, and the program automatically rounds the multiple of 20.
rtp_g711_dur_ms = 100
#UDP data socket buffer size configuration
#4*1024*1024=4196304
udp_recv_socket_buffer=4194304

[rtc]
#rtc playback push stream, playback timeout time
timeoutSec=15
#The visible IP of the RTC client is generally a public IP when used as a server. There can be multiple IPs, separate them with ','. When empty, the network card IP will be automatically obtained.
#At the same time, environment variables are supported, starting with $, such as "$EXTERN_IP"; please refer to：https://github.com/S3MediaKit/S3MediaKit/pull/1786
externIP=
#The rtc udp server listens to the port number, and all rtc clients will transmit stun/dtls/srtp/srtcp data through this port.
#This port is multi-threaded and supports connection migration caused by client network switching.
#It should be noted that if the server is in Nat and needs to do port mapping, it is necessary to ensure that the external network mapping port is consistent with the port.
port=8000
#The rtc tcp server listens to the port number. When udp is not connected, it will use tcp to transmit data.
#This port is multi-threaded and supports connection migration caused by client network switching.
#It should be noted that if the server is in Nat and needs to do port mapping, it is necessary to ensure that the external network mapping port is consistent with the port.
tcpPort = 8000
#Set the remb bit rate, turn off twcc and turn on remb when it is not 0. This setting is effective when rtc push flow, and can control the quality of push flow
#At present, twcc has been automatically adjusted by automatically adjusting the code rate, and closing remb to adjust the code rate according to the real network status
rembBitRate=0
#The audio codec type supported by rtc has higher priority in the previous
#The following examples are all supported audio codecs
preferredCodecA=PCMA,PCMU,opus,mpeg4-generic
#The video codec type supported by rtc has higher priority in the previous
#The following examples are all supported video codecs
preferredCodecV=H264,H265,AV1,VP9,VP8

#webrtc bit rate settings
start_bitrate=0
max_bitrate=0
min_bitrate=0

#Nack receiver, RTP sender, zlm sending RTC stream
#rtp resend cache queue maximum length, unit milliseconds
maxRtpCacheMS=5000
#The maximum length of the rtp resend cache queue, number of units
maxRtpCacheSize=2048

#Nack sending end, RTP receiving end, zlm receiving RTC push stream
#Maximum number of RTP packet loss statuses
nackMaxSize=2048
#Maximum retention time for RTP packet loss status
nackMaxMS=3000
#Nack maximum number of retransmissions requests
nackMaxCount=15
#Nack retransmission frequency, multiple of rtt
nackIntervalRatio=1.0
#The number of rtp in the nack package. Reducing this value can make the nack package more sensitive
nackRtpSize=8
#Have you tried to filter b frames
bfilter=0

[srt]
#srt playback push stream, playback timeout time, unit seconds
timeoutSec=5
#The srt udp server listens to the port number, and all srt clients will transmit srt data through this port.
#This port is multi-threaded and supports connection migration caused by client network switching.
port=9000
#The estimation parameter of late cache in the srt protocol is estimated in the handshake stage, and then latencyMul*rtt is the maximum cache time. The larger this parameter, the greater the time to wait for retransmission.
latencyMul=4
#The size of the package cache
pktBufSize=8192
#The password of the srt udp server, empty means no encryption
passPhrase=


[rtsp]
#Does the rtsp proprietary authentication method adopt base64 or md5 method?
authBasic=0
#Is rtsp stream pulling and streaming agents a direct proxy mode?
#Supports any encoding format after direct proxying, but it will cause the GOP cache to be unable to locate I frames, which may cause the screen to be broadcasted.
#And if it is tcp mode pulling stream, if rtp is greater than mtu, it will not be possible to use udp mode proxy.
#Assuming your stream source address is not 264 or 265 or AAC, then you can use the direct proxy to support rtsp proxy.
#If you are rtsp push and pull streaming, but webrtc playback, it is also recommended to turn off the direct proxy mode.
#Because when you are directly proxying, there may be no sps pps in RTP, which will cause webrtc to not be played; in addition, webrtc does not support Single NAL Unit Packets type RTP
#The rtsp direct proxy is enabled by default. Since rtmp does not have these problems, it is forced to open the direct proxy.
directProxy=1
#rtsp must complete the handshake within this time, otherwise the server will be disconnected in seconds
handshakeSecond=15
#rtsp timeout time, if no client data is received within that time,
#Or the tcp send cache exceeds this time, the connection will be disconnected in seconds
keepAliveSecond=15
#rtsp server listening address
port=554
#rtsps server listening address
sslport=0
#rtsp forwarding uses low-latency mode. When enabled, the rtp packet will not be cached to increase concurrency and reduce the delay of one frame.
lowLatency=0
#Force negotiation of rtp transmission method (0:TCP,1:UDP,2:MULTICAST,-1:No restrictions)
#When the client initiates RTSP SETUP, if the transmission type and this configuration are inconsistent, it will return 461 Unsupported transport.
#Force the client to resize and switch to the corresponding protocol. Currently supports FFMPEG and VLC
rtpTransportType=-1
[shell]
#Debugging the telnet server to receive the maximum buffer size
maxReqSize=1024
#Debug the telnet server listening port
port=0

[manager]
#The maximum number of devices that can be connected to the server at the same time
maxDevice=256
