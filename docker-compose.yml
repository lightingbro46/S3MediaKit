services:
  3spro-mserver:
    image: 3spro/3spro-mserver:latest
    container_name: 3spro-mserver
    init: true
    restart: always
    privileged: true
    shm_size: 2g 
    command: ./MediaServer -s default.pem -c ../conf/config.ini -l 1 -d
    network_mode: host
    volumes:
      - ./logs/media/:/opt/media/bin/log/
      - ./store/media/record/:/opt/media/bin/www/record/
      - ./store/media/db/:/opt/media/bin/db/
      - ./store/media/conf/:/opt/media/conf/
      - ./store/media/certs/:/opt/media/bin/certs/